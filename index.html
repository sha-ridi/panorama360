<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>360° Панорама</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.7/pannellum.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    /* Экран загрузки */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      z-index: 10;
      transition: opacity 0.6s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { margin: 0; font-size: 15px; letter-spacing: 0.02em; opacity: 0.8; }
    /* Прячем плашку "Pannellum 2.5.7", которая появляется по правому клику */
    .pnlm-about-msg { display: none !important; }
    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      z-index: 5;
      pointer-events: none;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>Загрузка панорамы…</p>
  </div>
  <div id="panorama"></div>
  <div class="hint" id="hint">Зажмите и двигайте, чтобы осмотреться · колесо / щипок — зум</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.7/pannellum.min.js"></script>
  <script>
    var viewer = pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: 'panorama.jpg',
      autoLoad: true,
      autoRotate: -2,
      autoRotateInactivityDelay: 3000,
      showZoomCtrl: true,
      showFullscreenCtrl: true,
      hfov: 100,
      minHfov: 40,
      maxHfov: 120,
      compass: false,
      keyboardZoom: true,
      mouseZoom: true,
      draggable: true,
      friction: 0.15
    });

    viewer.on('load', function () {
      document.getElementById('loader').classList.add('hidden');
    });

    // Прячем подсказку после первого взаимодействия
    var hint = document.getElementById('hint');
    ['mousedown', 'touchstart', 'wheel'].forEach(function (ev) {
      window.addEventListener(ev, function () {
        hint.style.opacity = '0';
      }, { once: true, passive: true });
    });
    // и сама пропадёт через 6 секунд
    setTimeout(function () { hint.style.opacity = '0'; }, 6000);
  </script>
</body>
</html>
